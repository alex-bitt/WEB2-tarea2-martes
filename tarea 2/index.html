<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseño</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="padre">

        <!-- LADO IZQUIERDO -->
        <div class="izquierda">

            <div class="circulo grande">
                <div class="punto"></div>
            </div>

            <div class="circulo pequeño"></div>

            <div class="circulo grande">
                <div class="punto"></div>
            </div>

        </div>


        <!-- CENTRO -->
        <div class="centro">

            <div class="nombre">
                nombre: alejandro
            </div>

            <div class="caja-grande">

            </div>

            <div class="cajas">

                <div class="caja"></div>
                <div class="caja"></div>
                <div class="caja"></div>

            </div>
            <div class="botones">
                <div class="boton">1</div>
                <div class="boton">2</div>
                <div class="boton">3</div>
                <div class="boton">4</div>
                <div class="boton">5</div>
            </div>
        </div>
        <!-- LADO DERECHO -->
        <div class="derecha">

            <div class="circulo grande">
                <div class="punto"></div>
            </div>

            <div class="circulo pequeño"></div>

            <div class="circulo grande">
                <div class="punto"></div>
            </div>

        </div>

    </div>


    <!-- PARTE INFERIOR -->
    <div class="pie">
        diseñado por: alejandro (vengo martes)
    </div>

</body>
</html>
